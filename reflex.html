<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Poornima Kallam Reflexes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container text-center mt-5">
      <h1 class="mb-4">Poornima Kallam Reflexes</h1>

      <div id="target" class="alert alert-success">Your time</div>

      <div id="counter" class="alert alert-primary">Count</div>

      <button class="btn btn-success m-2" onclick="beginTime()">Go</button>

      <button class="btn btn-danger m-2" onclick="recordTime()">Halt</button>
    </div>

    <script>
      var haltTime = undefined;

      function recordTime() {
        haltTime = Date.now();
        console.log(haltTime);
      }

      function beginTime() {
        haltTime = undefined;

        for (let i = 0; i <= 5; i++) {
          setTimeout(
            function () {
              document.getElementById("counter").innerHTML = i;
            },
            (5 - i) * 1000,
          );
        }

        setTimeout(function () {
          if (haltTime === undefined) {
            document.getElementById("target").innerHTML = "Not soon enough";
          } else {
            var targetTime = Date.now();
            var elapsed = targetTime - haltTime;

            document.getElementById("target").innerHTML =
              "Time was " + elapsed + " milliseconds";
          }
        }, 5000);
      }
    </script>
  </body>
</html>
