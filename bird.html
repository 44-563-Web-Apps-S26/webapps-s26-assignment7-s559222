<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Poornima Kallam Bird Hunt</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container text-center mt-5">
      <h1 class="mb-4">Poornima Kallam Bird Hunt</h1>

      <p class="lead">
        Click on the locations to find the birds, watch out for the forbidden
        statue
      </p>

      <div id="locations" class="alert alert-primary mt-3">
        Number of locations checked is zero.
      </div>

      <div id="score" class="alert alert-success">Score is zero.</div>

      <div class="alert alert-warning">Click for help.</div>

      <div id="help" class="alert alert-info">Help report</div>
    </div>
  </body>
</html>
