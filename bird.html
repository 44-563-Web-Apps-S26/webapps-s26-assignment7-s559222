        "img31",
        "img32",
        "img33",
        "img34",
      ];

      var score = 0;
      var locationsVisited = 0;
      var lastLocation = 0;

      var statueLocation = 19;
      var toucanLocation = 14;

      var lorikeetLocations = [3, 25];
      var buntingLocations = [2, 5, 11, 20, 21];

      var gameOver = false;

      function check(position) {
        if (gameOver) {
          return;
        }

        var id = ids[position];
        var image = document.getElementById(id);

        locationsVisited += 1;

        if (position == statueLocation) {
          image.src = "image2.png";
          score -= 3;
          gameOver = true;
        } else if (position == toucanLocation) {
          image.src = "image3.png";
          score += 5;
          image.onclick = null;
        } else if (lorikeetLocations.includes(position)) {
          image.src = "image4.jpg";
          score += 3;
          image.onclick = null;
        } else if (buntingLocations.includes(position)) {
          image.src = "image5.jpg";
          score += 1;
          image.onclick = null;
        } else {
          image.src = "image1.png";
        }

        document.getElementById("locations").innerHTML =
          "Number of locations checked is " + locationsVisited;

        document.getElementById("score").innerHTML = "Score is " + score;

        lastLocation = position;
      }

      function help() {
        var result = "silence";

        var neighbors = [
          (lastLocation + 1) % 35,
          (lastLocation - 1 + 35) % 35,
          (lastLocation + 7) % 35,
          (lastLocation - 7 + 35) % 35,
        ];

        for (let i = 0; i < neighbors.length; i++) {
          if (buntingLocations.includes(neighbors[i])) {
            result = "cheep";
          }
        }

        var nine = [
          lastLocation - 8,
          lastLocation - 7,
          lastLocation - 6,
          lastLocation - 1,
          lastLocation,
          lastLocation + 1,
          lastLocation + 6,
          lastLocation + 7,
          lastLocation + 8,
        ];

        if (nine.includes(toucanLocation)) {
          result = "caw";
        }

        if (nine.includes(statueLocation)) {
          result = "thrrum";
        }

        document.getElementById("help").innerHTML = result;
      }
